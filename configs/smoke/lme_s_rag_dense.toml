# Smoke test (engineering check, NOT a benchmark score): 2 LongMemEval_S questions, dense RAG.
[run]
name = "smoke_lme_s_rag_dense"
label = "smoke_test"
seed = 42

[benchmark]
name = "longmemeval"
variant = "s"
limit = 2

[memory]
method = "rag"
granularity = "round"
retriever = "dense"
top_k = 10
max_context_tokens = 8000
query_instruction = "Instruct: Given a question, retrieve chat history passages that help answer it\nQuery: "

[embedding]
backend = "ollama"
model = "qwen3-embedding:0.6b"
base_url = "http://127.0.0.1:11434"
num_ctx = 2048

[answer_model]
backend = "ollama"
model = "qwen3:0.6b"          # tiny model: smoke tests check plumbing, not quality
base_url = "http://127.0.0.1:11434"
temperature = 0.0
seed = 42
num_ctx = 16384
num_predict = 256
think = false

[judge]
backend = "ollama"
model = "qwen3:0.6b"
base_url = "http://127.0.0.1:11434"
temperature = 0.0
seed = 42
num_ctx = 8192
num_predict = 512
think = false
