# Local Adaptation template: lme_s x rag_bm25. ~115K-token histories.
# Fill every CHANGE_ME value, then: wlmem run <this file>; wlmem evaluate <this file>
[run]
name = "lme_s__rag_bm25__CHANGE_ME_answer_model"
label = "local_adaptation"
seed = 42

[benchmark]
name = "longmemeval"
variant = "s"

[memory]
method = "rag"
granularity = "round"
retriever = "bm25"
top_k = 20
max_context_tokens = 12000

[answer_model]
backend = "ollama"
model = "CHANGE_ME_answer_model"   # pick from `ollama list`; keep it fixed across all methods
base_url = "http://127.0.0.1:11434"
temperature = 0.0
seed = 42
num_ctx = 32768
num_predict = 512
think = false

[judge]
backend = "ollama"
model = "CHANGE_ME_judge_model"    # validate against human labels first (docs/EXPERIMENT_PROTOCOL.md §6)
base_url = "http://127.0.0.1:11434"
temperature = 0.0
seed = 42
num_ctx = 16384
num_predict = 1024
think = false
