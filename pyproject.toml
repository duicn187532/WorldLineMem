[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wlmem"
version = "0.1.0"
description = "Benchmark runner for agent long-term memory experiments (thesis groundwork)."
readme = "README.md"
requires-python = ">=3.11"
# Kept small on purpose. Every package here is needed either by the runner or by
# the official evaluation code that the runner imports (STALE, LongMemEval, Memora).
dependencies = [
    "numpy>=1.26",
    "openai>=1.35",        # imported at module level by LongMemEval's evaluate_qa.py
    "backoff>=2.2",        # imported at module level by LongMemEval's evaluate_qa.py
    "tqdm>=4.66",          # used by STALE and Memora evaluators
    "python-dotenv>=1.0",  # imported (optionally) by STALE's client helper
    "tiktoken>=0.7",       # token estimates; Memora's prompt builder uses it when present
]

[project.optional-dependencies]
dev = ["pytest>=8"]
faiss = ["faiss-cpu>=1.8"]

[project.scripts]
wlmem = "wlmem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
